name: TP-D contracts and clean replay
on:
  push:
    branches: [feature/sprint-9.1/tp-d-contracts-786722ff]
  pull_request:
    branches: [sprint-sprint-9.1]
    paths:
      - 'supabase/**'
      - 'src/types/productAnalytics.ts'
      - 'src/services/*Analytics*'
      - 'src/components/analytics/FunnelChart.tsx'
      - '.github/workflows/sprint91-contracts.yml'
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install pnpm 10 and dependencies
        run: |
          npm install --global pnpm@10.34.7
          pnpm install --frozen-lockfile
      - name: Verify types, tests, build and migration manifest
        run: |
          pnpm exec vitest run --maxWorkers=2
          pnpm exec tsc -b
          pnpm exec vite build
          node scripts/migration-checksums.mjs
          node scripts/check-migration-versions.mjs
      - uses: supabase/setup-cli@v1
        with:
          version: 2.121.0
      - name: Prepare exact baseline plus forward chain in a disposable local database
        shell: bash
        run: |
          replay_root="$RUNNER_TEMP/nubo-tpd-replay"
          mkdir -p "$replay_root/supabase/migrations"
          cp supabase/config.toml "$replay_root/supabase/config.toml"
          cp supabase/roles.sql "$replay_root/supabase/roles.sql"
          cp supabase/production_baseline.sql "$replay_root/supabase/migrations/20260814160000_production_baseline.sql"
          for migration in supabase/migrations/*.sql; do
            name="$(basename "$migration")"
            if [[ "${name:0:14}" > "20260814160000" ]]; then cp "$migration" "$replay_root/supabase/migrations/$name"; fi
          done
          echo "REPLAY_ROOT=$replay_root" >> "$GITHUB_ENV"
      - name: Replay from zero (local only)
        run: cd "$REPLAY_ROOT" && supabase db start
      - name: Exercise contracts on the clean replay with rollback
        shell: bash
        run: |
          {
            echo 'BEGIN;'
            echo "INSERT INTO public.institutions(id,name,is_partner) VALUES('91dd0000-0000-4000-8000-000000000011','TPD QA',true);"
            echo "INSERT INTO public.partner_institutions(institution_id) VALUES('91dd0000-0000-4000-8000-000000000011');"
            echo "INSERT INTO public.partner_opportunities(id,institution_id,name,opportunity_type) VALUES('91dd0000-0000-4000-8000-000000000012','91dd0000-0000-4000-8000-000000000011','TPD QA','programa de bolsa');"
            cat supabase/tests/sprint91_contracts/assert.sql
            cat supabase/tests/sprint91_contracts/cleanup.sql
            echo 'ROLLBACK;'
          } > "$RUNNER_TEMP/tpd-assert.sql"
          cd "$REPLAY_ROOT"
          docker exec -i supabase_db_nubo-conecta-admin psql -U postgres -d postgres -v ON_ERROR_STOP=1 < "$RUNNER_TEMP/tpd-assert.sql"
      - name: Stop disposable database
        if: always() && env.REPLAY_ROOT != ''
        run: cd "$REPLAY_ROOT" && supabase stop --no-backup
