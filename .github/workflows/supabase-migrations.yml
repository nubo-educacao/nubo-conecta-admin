name: Database migrations

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-migrations:
    name: Verify migration integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify migration names and checksums
        run: node scripts/migration-checksums.mjs

  replay-migrations:
    name: Replay migrations from zero
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Prepare the legacy production baseline
        shell: bash
        run: |
          replay_root="$RUNNER_TEMP/nubo-supabase-replay"
          mkdir -p "$replay_root/supabase/migrations"
          cp supabase/config.toml "$replay_root/supabase/config.toml"
          cp backup_prod_schema.sql "$replay_root/supabase/migrations/20260614170000_production_baseline.sql"

          for migration in supabase/migrations/*.sql; do
            name="$(basename "$migration")"
            if [[ "$name" > "20260614170000_" ]]; then
              cp "$migration" "$replay_root/supabase/migrations/$name"
            fi
          done

          echo "REPLAY_ROOT=$replay_root" >> "$GITHUB_ENV"

      - name: Start a clean local database and apply baseline plus forward migrations
        shell: bash
        run: cd "$REPLAY_ROOT" && supabase db start

      - name: Stop local database
        if: always()
        shell: bash
        run: cd "$REPLAY_ROOT" && supabase stop --no-backup

  migrate-production:
    name: Supabase production migrations
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: verify-migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Production
    concurrency:
      group: supabase-production-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - name: Check required production configuration
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" || -z "$SUPABASE_DB_PASSWORD" || -z "$SUPABASE_PROJECT_ID" ]]; then
            echo "Missing Production environment configuration."
            echo "Required secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD"
            echo "Required variable: SUPABASE_PROJECT_ID"
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.98.2

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Preview pending migrations
        run: supabase db push --dry-run --include-all

      - name: Apply pending migrations
        run: supabase db push --include-all

      - name: Verify production is synchronized
        run: supabase db push --dry-run --include-all
